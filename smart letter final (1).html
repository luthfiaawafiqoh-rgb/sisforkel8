        function getDB() {
            const data = localStorage.getItem(DB_KEY);
            if (!data) {

                return initialSeedData;
            }
            try {
                return JSON.parse(data);
            } catch (e) {
                localStorage.setItem(DB_KEY, JSON.stringify(initialSeedData));
                return initialSeedData;
            }
        }

        function saveDB(data) {
            try {
                localStorage.setItem(DB_KEY, JSON.stringify(data));
                return true;
            } catch (err) {
                showToast('Kapasitas LocalStorage Penuh! Harap kurangi ukuran file yang diunggah.', 'error');
                return false;
            }
        }

        function resetDB() {
            localStorage.setItem(DB_KEY, JSON.stringify(initialSeedData));
            showToast('Data sistem telah direset ke setelan awal!', 'success');
            setTimeout(() => location.reload(), 800);

        function showToast(msg, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const bgClass = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-sky-600';
            toast.className = `${bgClass} text-white px-4 py-3 rounded-xl shadow-lg flex items-center gap-3 transition-all transform translate-y-2 pointer-events-auto`;
            toast.innerHTML = `
                <i class="fa-solid ${type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-triangle-exclamation' : 'fa-circle-info'} text-lg"></i>
                <span class="text-sm font-medium">${msg}</span>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-[-10px]');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function formatBytes(bytes, decimals = 2) {
            if (!bytes || bytes === 0) return '0 Bytes';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
        }

        // ==========================================
        // 3. FILE PREVIEW & DOWNLOAD ENGINE
        // ==========================================
        function previewDocument(fileData, title = 'Pratinjau Dokumen') {
            if (!fileData || !fileData.dataUrl) {
                showToast('File dokumen tidak ditemukan atau tidak valid!', 'error');
                return;
            }

            const modal = document.getElementById('previewModal');
            const container = document.getElementById('previewContainer');
            const titleEl = document.getElementById('previewTitle');
            const metaEl = document.getElementById('previewMeta');
            const iconEl = document.getElementById('previewIcon');
            const downloadBtn = document.getElementById('previewDownloadBtn');

            titleEl.textContent = fileData.name || title;
            metaEl.textContent = `Ukuran: ${formatBytes(fileData.size || 0)} | Type: ${fileData.type || 'Dokumen'}`;
            
            // Set download action
            downloadBtn.onclick = () => downloadDocument(fileData);

            container.innerHTML = '';
            const type = fileData.type || '';

            if (type.includes('pdf')) {
                iconEl.innerHTML = `<i class="fa-solid fa-file-pdf text-red-400"></i>`;
                container.innerHTML = `<iframe src="${fileData.dataUrl}" class="w-full h-[650px] rounded-lg shadow-lg border border-slate-300"></iframe>`;
            } else if (type.includes('image') || type.includes('png') || type.includes('jpeg') || type.includes('jpg') || type.includes('svg')) {
                iconEl.innerHTML = `<i class="fa-solid fa-file-image text-emerald-400"></i>`;
                container.innerHTML = `<img src="${fileData.dataUrl}" alt="Preview" class="max-h-[650px] max-w-full rounded-lg shadow-md border object-contain bg-white p-2" />`;
            } else {
                // Word / DOCX / Fallback Card
                iconEl.innerHTML = `<i class="fa-solid fa-file-word text-blue-400"></i>`;
                container.innerHTML = `
                    <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md text-center border border-slate-200">
                        <div class="w-20 h-20 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-4xl mx-auto mb-4">
                            <i class="fa-solid fa-file-word"></i>
                        </div>
                        <h4 class="font-bold text-slate-800 text-lg mb-1">${fileData.name}</h4>
                        <p class="text-xs text-slate-500 mb-4">Browser tidak mendukung pratinjau langsung untuk format file Word/Dokumen Office secara inline.</p>
                        <div class="bg-slate-50 p-3 rounded-lg text-left text-xs mb-6 text-slate-600 space-y-1 border">
                            <div><strong>Ukuran:</strong> ${formatBytes(fileData.size || 0)}</div>
                            <div><strong>Tipe Mime:</strong> ${fileData.type || 'doc/docx'}</div>
                        </div>
                        <button onclick="downloadDocument(JSON.parse('${escapeJSON(JSON.stringify(fileData))}'))" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-medium py-2.5 rounded-lg transition flex items-center justify-center gap-2 shadow">
                            <i class="fa-solid fa-download"></i> Unduh File Sekarang
                        </button>
                    </div>
                `;
            }

            modal.classList.remove('hidden');
        }

        function closePreviewModal() {
            document.getElementById('previewModal').classList.add('hidden');
            document.getElementById('previewContainer').innerHTML = '';
        }

        function downloadDocument(fileData) {
            if (!fileData || !fileData.dataUrl) {
                showToast('File tidak tersedia untuk diunduh.', 'error');
                return;
            }
            const a = document.createElement('a');
            a.href = fileData.dataUrl;
            a.download = fileData.name || 'Dokumen_Surat.pdf';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            showToast(`Mengunduh: ${fileData.name}`, 'success');
        }

        function escapeJSON(str) {
            return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }

        // Helper for Dropzone File Reading
        function handleFileInput(inputEl, dropzoneEl, previewZoneEl, storeTarget) {
            const file = inputEl.files[0];
            if (!file) return;

            // Safe size limit check (warn if > 2.5 MB for LocalStorage safety)
            if (file.size > 3000000) {
                showToast('File terlalu besar (> 3MB)! Disarankan memilih file berukuran lebih kecil agar ramah penyimpanan.', 'error');
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                storeTarget.fileData = {
                    name: file.name,
                    size: file.size,
                    type: file.type || 'application/octet-stream',
                    dataUrl: e.target.result
                };

                // Update UI preview zone
                dropzoneEl.classList.add('hidden');
                previewZoneEl.classList.remove('hidden');
                previewZoneEl.innerHTML = `
                    <div class="flex items-center justify-between bg-sky-50 p-3 rounded-lg border border-sky-200">
                        <div class="flex items-center gap-3 overflow-hidden">
                            <i class="fa-solid ${file.type.includes('pdf') ? 'fa-file-pdf text-red-500' : 'fa-file-image text-emerald-500'} text-2xl"></i>
                            <div class="truncate">
                                <div class="text-sm font-semibold text-slate-800 truncate">${file.name}</div>
                                <div class="text-xs text-slate-500">${formatBytes(file.size)}</div>
                            </div>
                        </div>
                        <button type="button" onclick="removeSelectedFile('${inputEl.id}', '${dropzoneEl.id}', '${previewZoneEl.id}')" class="text-rose-500 hover:text-rose-700 p-2">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                `;
                showToast('File berhasil diproses!', 'success');
            };
            reader.readAsDataURL(file);
        }

        function removeSelectedFile(inputId, dropzoneId, previewZoneId) {
            document.getElementById(inputId).value = '';
            document.getElementById(dropzoneId).classList.remove('hidden');
            const previewZone = document.getElementById(previewZoneId);
            previewZone.classList.add('hidden');
            previewZone.innerHTML = '';
            showToast('File dihapus dari input.', 'info');
        }

        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('loginUsername').value;
            const p = document.getElementById('loginPassword').value;
            const user = db.users.find(x => x.username === u && x.password === p);

            if (user) {
                db.currentUser = user;
                saveDB(db);
                logActivity('Login', `User ${user.name} (${user.role}) berhasil login.`);
                showToast(`Selamat datang, ${user.name}!`, 'success');
                renderApp();
            } else {
                showToast('Username atau password salah!', 'error');
            }
        }

        function quickLogin(role) {
            const user = db.users.find(x => x.role === role);
            if (user) {
                db.currentUser = user;
                saveDB(db);
                logActivity('Quick Login', `Quick login sebagai ${user.role}`);
                showToast(`Login sebagai ${user.name}`, 'success');
                renderApp();
            }
        }

        function handleLogout() {
            logActivity('Logout', `User ${db.currentUser.name} keluar dari sistem.`);
            db.currentUser = null;
            saveDB(db);
            showToast('Anda telah logout.', 'info');
            renderApp();
        }

            return `

                                    <i class="fa-solid fa-file-csv"></i> Export CSV / Excel
                                </button>
                            </div>

                            <div class="border rounded-xl p-5 bg-indigo-50/50 flex flex-col justify-between">
                                <div>
                                    <div class="text-indigo-600 text-2xl font-bold mb-2"><i class="fa-solid fa-paper-plane"></i></div>

                                    <p class="text-xs text-slate-500 mt-1">Total ${db.suratKeluar.length} dokumen surat keluar terdaftar.</p>
                                </div>
                                <button onclick="exportCSV('suratKeluar')" class="mt-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-3 rounded-lg text-xs transition flex items-center justify-center gap-2">
                                    <i class="fa-solid fa-file-csv"></i> Export CSV / Excel
                                </button>
                            </div>

                            <div class="border rounded-xl p-5 bg-emerald-50/50 flex flex-col justify-between">
                                <div>
                                    <div class="text-emerald-600 text-2xl font-bold mb-2"><i class="fa-solid fa-box-archive"></i></div>
                                    <h4 class="font-bold text-slate-800 text-sm">Laporan Arsip Digital</h4>
                                    <p class="text-xs text-slate-500 mt-1">Total ${db.arsipDigital.length} berkas arsip tersimpan.</p>
                                </div>
                                <button onclick="exportCSV('arsipDigital')" class="mt-4 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 px-3 rounded-lg text-xs transition flex items-center justify-center gap-2">
                                    <i class="fa-solid fa-file-csv"></i> Export CSV / Excel
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function exportCSV(type) {
            let csvContent = "data:text/csv;charset=utf-8,";
            let filename = `Laporan_${type}_${new Date().toISOString().slice(0, 10)}.csv`;

            if (type === 'suratMasuk') {
                csvContent += "No Agenda,No Surat,Pengirim,Tanggal Surat,Sifat,Status\n";
                db.suratMasuk.forEach(s => {
                    csvContent += `"${s.noAgenda}","${s.noSurat}","${s.pengirim}","${s.tglSurat}","${s.sifat}","${s.status}"\n`;
                });
            } else if (type === 'suratKeluar') {
                csvContent += "No Surat,Penerima,Tanggal Surat,Sifat,Status\n";
                db.suratKeluar.forEach(s => {
                    csvContent += `"${s.noSurat}","${s.penerima}","${s.tglSurat}","${s.sifat}","${s.status}"\n`;
                });
            } else if (type === 'arsipDigital') {
                csvContent += "Kode Arsip,Nama Arsip,Kategori,Tanggal\n";
                db.arsipDigital.forEach(a => {
                    csvContent += `"${a.kodeArsip}","${a.namaArsip}","${a.kategori}","${a.tglArsip}"\n`;
                });
            }

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", filename);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast(`Laporan ${type} berhasil diexport!`, 'success');
        }
